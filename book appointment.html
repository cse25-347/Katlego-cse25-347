    <h1>BOOK APPOINTMENT</h1>

</header>

<section>

    <img src="booking.jpg" alt="Booking Image">

    <form>

        <input type="text" placeholder="Full Name" required>

        <br><br>

        <input type="tel" placeholder="Phone Number" required>

        <br><br>

        <input type="email" placeholder="Email Address" required>

        <br><br>

        <input type="text" placeholder="Vehicle Make" required>

        <br><br>

        <input type="text" placeholder="Vehicle Model" required>

        <br><br>

        <input type="text" placeholder="Vehicle Registration">

        <br><br>

        <select>

            <option>Select Service</option>
            <option>Engine Tuning</option>
            <option>Suspension Upgrade</option>
            <option>Body Kit Installation</option>
            <option>Maintenance</option>

        </select>

        <br><br>

        <input type="date" required>

        <br><br>

        <input type="time" required>

        <br><br>

        <textarea placeholder="Additional Notes"></textarea>

        <br><br>

        <button type="submit">Confirm Booking</button>

    </form>

</section>
